[project]
name = "agentic-ai-lesson"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "jupytext>=1.18.1",
  "myst-nb>=1.3.0",
  "sphinx>=8.2.3",
  "sphinx-evita>=0.3.1b0",
  "sphinx-lesson>=0.8.16",
  "sphinxcontrib-bibtex>=2.6.5",
  "sphinxcontrib-mermaid>=2.0.0",
]

[dependency-groups]
dev = [
  "agentic-ai-hands-on",
  "jupyterlab>=4.4.6",
  "jupyterlab-myst>=2.4.2",
]
notebook = []

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = false

[tool.uv.workspace]
members = [
    "content/hands-on",
]

[tool.uv.sources]
agentic-ai-hands-on = { workspace = true, editable = true }

# rumdl configuration - Relaxed preset
# Lenient settings for existing projects adopting rumdl incrementally.
# Minimizes initial warnings while still catching important issues.

[tool.rumdl]
exclude = [
    ".git",
    ".github",
    "node_modules",
    "vendor",
    "dist",
    "build",
    "CHANGELOG.md",
    "LICENSE.md",
]
respect-gitignore = true

# Disable rules that produce the most noise on existing projects
disable = [
    "MD013",  # Line length - most existing files exceed 80 chars
    "MD033",  # Inline HTML - commonly used in real-world markdown
    "MD041",  # First line heading - not all files need it
]

[tool.rumdl.global]
flavor = "myst"

# Consistent heading style (any style, just be consistent)
[tool.rumdl.MD003]
style = "consistent"

# Consistent list style
[tool.rumdl.MD004]
style = "consistent"

# Consistent emphasis style
[tool.rumdl.MD049]
style = "consistent"

# Consistent strong style
[tool.rumdl.MD050]
style = "consistent"
